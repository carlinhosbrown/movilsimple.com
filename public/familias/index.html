<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>MovilSimple Familia — Acceso</title>
<link rel="stylesheet" href="/assets/sitio.css">
<style>
.login{min-height:calc(100vh - 73px);display:grid;place-items:center;padding:40px 0;background:var(--soft)}
.login .dl-card{width:min(440px,100%)}
.login h1{font-size:34px;letter-spacing:-.04em;margin:14px 0 10px;line-height:1.1}
.login .btn{width:100%;margin-top:6px}
</style>
</head>
<body>
<header>
  <div class="container nav">
    <a class="wordmark" href="/"><span class="m">Movil</span>Simple <span style="color:var(--muted);font-weight:650">Familia</span></a>
  </div>
</header>
<main class="login">
  <div class="container" style="display:grid;place-items:center">
    <div class="dl-card">
      <div class="pin" style="display:inline-block">Próximamente</div>
      <h1>Gestiona el móvil de tu familiar desde aquí.</h1>
      <p>Apps, contactos, citas del calendario y ubicación, desde el ordenador o tu móvil. Llega con la suscripción MovilSimple Familia.</p>
      <a class="btn btn-dark" href="/#beta">Avisadme cuando abra</a>
      <a class="btn btn-light" href="/">Volver a movilsimple.com</a>
    </div>
  </div>
</main>
</body>
</html>
